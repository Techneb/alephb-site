<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlephB</title>
<meta name="description" content="Small apps and games by AlephB.">
<style>
:root{--bg:#fbfbf9;--ink:#15191b;--muted:#5d6a6e;--line:#e2e6e6;--accent:#1d7f92;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101415;--ink:#eef2f3;--muted:#98a8ac;--line:#243033;--accent:#4cc3dd;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:64px 20px 48px}
h1{font-size:30px;letter-spacing:-.01em;margin:0 0 6px}
p.lede{color:var(--muted);margin:0 0 40px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{padding:18px 0;border-bottom:1px solid var(--line)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
li a{font-weight:600;font-size:19px}
li span{display:block;color:var(--muted)}
footer{margin-top:40px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>AlephB</h1>
  <p class="lede">Small apps and games.</p>
  <ul>
    <li><a href="https://compromise.alephb.uk">Compromise</a><span>An iOS app that finds a fair place to meet.</span></li>
    <li><a href="https://mystery.alephb.uk">The Ritz Affair</a><span>A murder mystery you solve in SQL, in the browser.</span></li>
  </ul>
  <footer>Contact: <a href="mailto:contact@alephb.uk">contact@alephb.uk</a></footer>
</main>
</body>
</html>
